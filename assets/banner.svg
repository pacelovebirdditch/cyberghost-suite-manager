<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#0a1225"/>
      <stop offset="100%" stop-color="#0d0518"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ee6e6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3ee6e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a3ee6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7a3ee6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghostBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f6ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8fe3ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8fe3ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bdeeff"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ee6e6"/>
      <stop offset="100%" stop-color="#7a3ee6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- ambient glows -->
  <circle cx="950" cy="120" r="260" fill="url(#glowCyan)"/>
  <circle cx="1020" cy="260" r="220" fill="url(#glowPurple)"/>

  <!-- faint circuit grid -->
  <g stroke="#2a3a55" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <path d="M700 60 L740 60 L740 110 L820 110" fill="none"/>
    <path d="M900 300 L860 300 L860 250 L780 250" fill="none"/>
    <circle cx="740" cy="110" r="4" fill="#3ee6e6"/>
    <circle cx="820" cy="110" r="4" fill="#3ee6e6"/>
    <circle cx="860" cy="250" r="4" fill="#7a3ee6"/>
    <circle cx="780" cy="250" r="4" fill="#7a3ee6"/>
  </g>

  <!-- scattered digital particles -->
  <g fill="#8fe3ff" opacity="0.7">
    <circle cx="760" cy="70" r="2"/>
    <circle cx="1080" cy="90" r="2.5"/>
    <circle cx="1000" cy="60" r="1.8"/>
    <circle cx="880" cy="300" r="2"/>
    <circle cx="1120" cy="200" r="2.2"/>
    <circle cx="950" cy="320" r="1.6"/>
    <circle cx="1050" cy="330" r="2"/>
  </g>

  <!-- Ghost silhouette (right side) -->
  <g transform="translate(940,150)">
    <path d="M0,-90 C60,-90 100,-45 100,10 L100,90 
             C90,80 80,95 70,85 
             C60,95 50,80 40,90 
             C30,80 20,95 10,85 
             C0,95 -10,80 -20,90 
             C-30,80 -40,95 -50,85 
             C-60,95 -70,80 -80,90 
             C-90,80 -100,90 -100,90 
             L-100,10 C-100,-45 -60,-90 0,-90 Z"
          fill="url(#ghostBody)" stroke="#8fe3ff" stroke-width="1.5" stroke-opacity="0.45"/>
    <circle cx="-30" cy="-10" r="9" fill="#0a1225" stroke="#3ee6e6" stroke-width="2" opacity="0.85"/>
    <circle cx="30" cy="-10" r="9" fill="#0a1225" stroke="#3ee6e6" stroke-width="2" opacity="0.85"/>
    <circle cx="-30" cy="-10" r="3" fill="#3ee6e6"/>
    <circle cx="30" cy="-10" r="3" fill="#3ee6e6"/>
    <path d="M-15,20 C-5,28 5,28 15,20" fill="none" stroke="#7a3ee6" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Shield/lock emblem near ghost -->
  <g transform="translate(1020,60)">
    <path d="M0,0 L28,10 L28,42 C28,66 14,80 0,88 C-14,80 -28,66 -28,42 L-28,10 Z"
          fill="none" stroke="url(#lockGrad)" stroke-width="2.5" opacity="0.75"/>
    <rect x="-9" y="34" width="18" height="16" rx="3" fill="none" stroke="#bdeeff" stroke-width="2" opacity="0.8"/>
    <path d="M-6,34 L-6,26 C-6,20 6,20 6,26 L6,34" fill="none" stroke="#bdeeff" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="url(#titleGrad)">
    <tspan x="60" y="150" font-size="62" textLength="820" lengthAdjust="spacingAndGlyphs">CyberGhost Full Version</tspan>
    <tspan x="60" y="222" font-size="62" textLength="360" lengthAdjust="spacingAndGlyphs">Download</tspan>
  </text>

  <!-- Tagline -->
  <text x="62" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#a9d8e6" opacity="0.9"
        textLength="760" lengthAdjust="spacingAndGlyphs">
    CyberGhost Full Version Download — a lightweight Windows tool.
  </text>

  <!-- thin accent line -->
  <rect x="62" y="288" width="140" height="3" fill="#3ee6e6" opacity="0.8"/>
  <rect x="206" y="288" width="40" height="3" fill="#7a3ee6" opacity="0.8"/>
</svg>